<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WebRTC Browser Test</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 12px; }
    video { width: 320px; height: 240px; background: #000; margin: 8px; }
    #controls { margin-bottom: 12px; }
  </style>
</head>
<body>
  <h3>WebRTC Browser Test (open two windows)</h3>
  <div id="controls">
    <button id="startBtn">Start / Join</button>
    <button id="leaveBtn">Leave</button>
    <span id="status">idle</span>
  </div>
  <div>
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
  <pre id="log" style="height:200px;overflow:auto;background:#f4f4f4;padding:8px"></pre>

  <script src="https://cdn.socket.io/4.7.0/socket.io.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
